<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asisten Revisi Teks Berita AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 { margin-top: 0; color: #1a365d; text-align: center; }
    p.desc { text-align: center; color: #666; margin-bottom: 25px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 14px;
      resize: vertical;
    }
    .upload-box {
      margin-top: 15px;
      border: 2px dashed #cbd5e0;
      padding: 15px;
      border-radius: 6px;
      background: #fafafa;
      text-align: center;
    }
    #imagePreview {
      max-width: 100%;
      max-height: 150px;
      margin-top: 10px;
      border-radius: 4px;
      display: none;
    }
    button {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }
    button:hover { background-color: #2c5282; }
    button:disabled { background-color: #a0aec0; cursor: not-allowed; }
    .output-box {
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      padding: 15px;
      background: #fafafa;
      height: 430px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.6;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Editor & Analisis Teks Berita AI</h1>
  <p class="desc">Ketik/tempelkan teks ATAU unggah foto draf berita (JPG/PNG). AI akan memberikan analisis dan saran revisi tanpa membuatkan teks baru.</p>

  <div class="grid">
    <div>
      <label for="newsInput"><strong>1. Ketik/Tempelkan Teks Berita:</strong></label>
      <textarea id="newsInput" placeholder="Ketik atau tempel draf berita di sini..."></textarea>

      <div class="upload-box">
        <label for="imageInput"><strong>2. ATAU Unggah Gambar Draf (JPG/PNG):</strong></label><br>
        <input type="file" id="imageInput" accept="image/jpeg, image/png" onchange="previewImage(event)">
        <br>
        <img id="imagePreview" alt="Pratinjau Gambar">
      </div>

      <button id="analyzeBtn" onclick="analyzeText()">Analisis & Beri Masukan</button>
    </div>

    <div>
      <label><strong>Hasil Analisis & Masukan Revisi:</strong></label>
      <div id="outputBox" class="output-box">Hasil masukan dan analisis akan muncul di sini setelah Anda mengklik tombol di sebelah kiri.</div>
    </div>
  </div>
  <div id="status" class="status"></div>
</div>

<script>
// MASUKKAN API KEY GEMINI KAMU DI DALAM TANDA PETIK DI BAWAH INI:
const API_KEY = "AQ.Ab8RN6L93Y4hS4_Jygpf3vIu7VYZCwHx6La-YM46i_KsJxpqNw"; 

let imageBase64 = null;
let imageMimeType = null;

function previewImage(event) {
  const file = event.target.files[0];
  const preview = document.getElementById('imagePreview');
  
  if (file) {
    if (file.type !== 'image/jpeg' && file.type !== 'image/png') {
      alert('Format file harus berupa JPG atau PNG!');
      event.target.value = '';
      preview.style.display = 'none';
      imageBase64 = null;
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      preview.src = e.target.result;
      preview.style.display = 'block';
      imageBase64 = e.target.result.split(',')[1];
      imageMimeType = file.type;
    };
    reader.readAsDataURL(file);
  } else {
    preview.style.display = 'none';
    imageBase64 = null;
    imageMimeType = null;
  }
}

async function analyzeText() {
  const newsText = document.getElementById('newsInput').value.trim();
  const outputBox = document.getElementById('outputBox');
  const statusDiv = document.getElementById('status');
  const btn = document.getElementById('analyzeBtn');

  if (API_KEY === "PASTE_API_KEY_KAMU_DI_SINI" || !API_KEY) {
    alert('Harap isi API_KEY terlebih dahulu di dalam kode JavaScript!');
    return;
  }

  if (!newsText && !imageBase64) {
    alert('Harap masukkan draf teks berita ATAU unggah gambar draf berita!');
    return;
  }

  btn.disabled = true;
  statusDiv.textContent = 'Sedang menganalisis teks/gambar...';
  outputBox.textContent = 'Menganalisis draf berita...';

  const systemInstruction = `Kamu adalah seorang Editor Berita Senior (News Editor) dan instruktur jurnalistik.
TUGAS UTAMA: Memberikan analisis, masukan, kritik konstruktif, serta saran revisi pada draf berita (baik dalam bentuk teks maupun gambar tulisan/dokumen yang diunggah pengguna).

ATURAN KETAT:
1. DILARANG KERAS menulis ulang teks berita secara utuh dari awal sampai akhir.
2. DILARANG KERAS membuatkan teks berita baru secara mandiri.
3. Jika draf diberikan dalam bentuk gambar, pertama-tama bacalah teks yang ada di dalam gambar tersebut, lalu berikan masukannya.
4. Berikan masukan secara terstruktur: Evaluasi 5W+1H, Struktur Berita (Piramida Terbalik), Gaya Bahasa Jurnalistik, dan Koreksi PUEBI/Ejaan.
5. Berikan panduan dan alasan mengapa bagian tersebut perlu direvisi agar penulis dapat belajar menyunting teksnya sendiri.`;

  const userParts = [];
  if (newsText) userParts.push({ text: `Draf Teks Berita:\n${newsText}` });
  if (imageBase64) {
    userParts.push({ inlineData: { mimeType: imageMimeType, data: imageBase64 } });
    userParts.push({ text: "Berikut adalah gambar draf berita yang perlu dianalisis." });
  }

  try {
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ role: "user", parts: userParts }],
      systemInstruction: { parts: [{ text: systemInstruction }] }
    })
  });

  const data = await response.json();
  
  if (response.ok) {
    if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
      outputBox.textContent = data.candidates[0].content.parts[0].text;
      statusDiv.textContent = 'Analisis selesai!';
    } else {
      outputBox.textContent = 'Gagal membaca respon AI. Detail: ' + JSON.stringify(data);
      statusDiv.textContent = 'Format respon tidak sesuai.';
    }
  } else {
    outputBox.textContent = 'Terjadi kesalahan dari API (' + response.status + '):\n' + JSON.stringify(data, null, 2);
    statusDiv.textContent = 'Gagal menganalisis.';
  }
} catch (err) {
  outputBox.textContent = 'Error koneksi/sistem: ' + err.message;
  statusDiv.textContent = 'Gagal menganalisis.';
}
</script>

</body>
</html>
